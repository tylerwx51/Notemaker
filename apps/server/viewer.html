<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>NoteMaker</title><style>

<h1>NoteMaker live viewer</h1><label>Document <input id="doc" value="notes"></label><button id="open">Open</button><label>Page <input id="page" type="number" min="1" value="1" style="width:60px"></label><span id="status"></span><div id="layers"></div><canvas id="canvas" width="1000" height="1400"></canvas><p>Scroll to zoom on infinite documents; drag to pan. Layer visibility is local unless “force visible” is enabled on a tablet.</p>

function argb(n){return '#'+(n&0xffffff).toString(16).padStart(6,'0')+((n>>>24)&255).toString(16).padStart(2,'0')}

const svgImages=new Map();
function drawSvg(o){

async function poll(){let g=generation;try{let r=await fetch('/api/events?document='+encodeURIComponent(doc)+'&after='+cursor);if(!r.ok)throw Error();let data=await r.json();if(g!==generation)return;if(data.events.length){for(const e of data.events){ops.push(e.op);cursor=e.seq}render()}let lr=await fetch('/api/locks?document='+encodeURIComponent(doc));if(!lr.ok)throw Error();let lockState=await lr.json();if(g!==generation)return;const next=lockState.previews||{};if(JSON.stringify(previews)!==JSON.stringify(next)){previews=next;render()}document.querySelector('#status').textContent='Connected · '+type+' · '+cursor+' events'}catch(e){document.querySelector('#status').textContent='Disconnected; retrying'}finally{setTimeout(poll,200)}}
