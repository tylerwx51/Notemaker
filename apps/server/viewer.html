<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>NoteMaker</title><style>
body{font:16px system-ui;margin:16px;background:#eee}button,input,select{font:inherit;padding:8px;margin:4px}canvas{background:white;border:1px solid #555;max-width:100%;touch-action:none}#layers label{display:inline-block;margin:8px}#status{margin:8px} </style></head><body>
<h1>NoteMaker live viewer</h1><label>Document <input id="doc" value="notes"></label><button id="open">Open</button><label>Page <input id="page" type="number" min="1" value="1" style="width:60px"></label><span id="status"></span><div id="layers"></div><canvas id="canvas" width="1000" height="1400"></canvas><p>Scroll to zoom on infinite documents; drag to pan. Layer visibility is local unless “force visible” is enabled on a tablet.</p>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let cursor=0,ops=[],hidden=new Set(),doc=new URLSearchParams(location.search).get('document')||'notes',type='fixed',zoom=1,panX=0,panY=0,generation=0;
function render(){let layers=new Map([['base',{name:'Layer 1',force:false}]]),strokes=new Map(),objects=new Map(),active=new Map(),objectActive=new Map(),layerActive=new Map(),seen=false;function apply(o){if(o.kind==='batch'){o.actions.forEach(apply);return;}if(o.kind==='document'&&!seen){type=o.type;seen=true;}if(o.kind==='layer')layers.set(o.layer,o);if(o.kind==='stroke')strokes.set(o.stroke,o);if(o.kind==='active')active.set(o.stroke,o.active);if(o.kind==='object')objects.set(o.object,o);if(o.kind==='object-active')objectActive.set(o.object,o.active);if(o.kind==='layer-active')layerActive.set(o.layer,o.active)}ops.forEach(apply);
const box=document.querySelector('#layers');box.replaceChildren();for(const [id,l] of layers){if(layerActive.get(id)===false)continue;let label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=l.force||!hidden.has(id);check.disabled=l.force;check.onchange=()=>{check.checked?hidden.delete(id):hidden.add(id);render()};label.append(check,document.createTextNode(l.name+(l.force?' (forced visible)':'')));box.append(label)}
ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='white';ctx.fillRect(0,0,1000,1400);if(type==='infinite')ctx.setTransform(zoom,0,0,zoom,panX,panY);for(const [id,l] of layers){if(layerActive.get(id)===false||(hidden.has(id)&&!l.force))continue;for(const [sid,s] of strokes){if(s.layer!==id||active.get(sid)===false||s.page!==(type==='pages'?Number(document.querySelector('#page').value)-1:0))continue;ctx.fillStyle='#'+(s.color&0xffffff).toString(16).padStart(6,'0');ctx.strokeStyle=ctx.fillStyle;ctx.lineCap='round';let prev=null;for(const p of s.points){let w=s.width*(.25+.75*p[2]);if(prev){ctx.lineWidth=(w+prev[3])/2;ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(p[0],p[1]);ctx.stroke()}ctx.beginPath();ctx.arc(p[0],p[1],w/2,0,Math.PI*2);ctx.fill();prev=[...p,w]}}for(const [oid,o] of objects){if(o.layer===id&&objectActive.get(oid)!==false&&o.page===(type==='pages'?Number(document.querySelector('#page').value)-1:0))drawObject(o,objects)}}}
function argb(n){return '#'+(n&0xffffff).toString(16).padStart(6,'0')+((n>>>24)&255).toString(16).padStart(2,'0')}
function drawObject(o,objects){
 let {x,y,w,h}=o;ctx.strokeStyle=argb(o.color);ctx.fillStyle=argb(o.color);ctx.lineWidth=o.width;ctx.lineCap='round';
 function line(x,y,ex,ey){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke()}
 if(o.shape==='arrow'){
  let ex=x+w,ey=y+h,a=objects.get(o.from),b=objects.get(o.to);if(a){x=a.x+a.w/2;y=a.y+a.h/2}if(b){ex=b.x+b.w/2;ey=b.y+b.h/2}
  function edge(n,x,y,tx,ty){if(!n||(x===tx&&y===ty))return [x,y];let dx=tx-x,dy=ty-y,rx=n.w/2,ry=n.h/2,t=n.shape==='ellipse'?1/Math.sqrt(dx*dx/(rx*rx)+dy*dy/(ry*ry)):Math.min(dx===0?Infinity:rx/Math.abs(dx),dy===0?Infinity:ry/Math.abs(dy));return [x+t*dx,y+t*dy]}
  let start=edge(a,x,y,ex,ey),end=edge(b,ex,ey,x,y);[x,y]=start;[ex,ey]=end;line(x,y,ex,ey);let angle=Math.atan2(ey-y,ex-x),length=Math.max(12,o.width*4);for(let offset of [-.45,.45])line(ex,ey,ex-length*Math.cos(angle+offset),ey-length*Math.sin(angle+offset));x=(x+ex)/2;y=(y+ey)/2;
 }else if(o.shape!=='text'){
  ctx.beginPath();if(o.shape==='ellipse')ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);else ctx.rect(x,y,w,h);if(o.fill!==undefined){ctx.fillStyle=argb(o.fill);ctx.fill()}ctx.stroke();
 }
 ctx.fillStyle=argb(o.color);let size=o.fontSize||24;ctx.font=size+'px sans-serif';if(o.shape==='ellipse'){x+=25;y+=h/2-size}(o.text||'').split('\n').forEach((text,i)=>ctx.fillText(text,x+(o.shape==='text'?0:10),y+size+i*size*1.2));
}
async function poll(){let g=generation;try{let r=await fetch('/api/events?document='+encodeURIComponent(doc)+'&after='+cursor);if(!r.ok)throw Error();let data=await r.json();if(g!==generation)return;if(data.events.length){for(const e of data.events){ops.push(e.op);cursor=e.seq}render()}document.querySelector('#status').textContent='Connected · '+type+' · '+cursor+' events'}catch(e){document.querySelector('#status').textContent='Disconnected; retrying'}finally{setTimeout(poll,200)}}
document.querySelector('#open').onclick=()=>{generation++;doc=document.querySelector('#doc').value;cursor=0;ops=[];hidden.clear();type='fixed';zoom=1;panX=panY=0;render()};document.querySelector('#page').onchange=render;
canvas.onwheel=e=>{if(type!=='infinite')return;e.preventDefault();zoom=Math.max(.2,Math.min(5,zoom*(e.deltaY<0?1.1:.9)));render()};let drag=null;canvas.onpointerdown=e=>{if(type==='infinite'){drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)}};canvas.onpointermove=e=>{if(drag){panX+=(e.clientX-drag[0])*1000/canvas.clientWidth;panY+=(e.clientY-drag[1])*1400/canvas.clientHeight;drag=[e.clientX,e.clientY];render()}};canvas.onpointerup=()=>drag=null;document.querySelector('#doc').value=doc;render();poll();
</script></body></html>
