<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720">
<title>Unified drawn item coverage: selection and partial erasing</title>
<desc>Two monochrome tablet mockups. Selection follows the silhouette of a transparent leaf image. Partial erasing cuts an ink stroke only on the active layer, leaving a background circle intact.</desc>
<defs>
 <pattern id="checks" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#fff"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#eee"/></pattern>
 <path id="leaf" d="M180 335 C115 260 155 180 315 165 C330 280 275 335 180 335Z"/>
 <mask id="cut"><rect width="530" height="720" fill="white"/><path d="M250 280V420" stroke="black" stroke-width="48" stroke-linecap="round"/></mask>
</defs>
<rect width="1120" height="720" fill="#f3f2ef"/>
<g font-family="Arial, sans-serif" fill="#202020">
 <text x="30" y="37" font-size="24" font-weight="bold">One area model for every drawn item</text>
 <text x="30" y="65" font-size="16">Coverage follows the visible mark. Every interaction stays on the active layer.</text>
 <g transform="translate(25 90)">
  <rect width="525" height="600" rx="12" fill="white" stroke="#333" stroke-width="2"/>
  <text x="20" y="33" font-size="20" font-weight="bold">01  Select a transparent image</text>
  <path d="M0 50H525M0 104H525" stroke="#999"/>
  <rect x="15" y="63" width="86" height="29" rx="4" fill="#202020"/>
  <text x="32" y="83" fill="white" font-size="16">Select</text>
  <text x="120" y="83" font-size="16">Move   Resize   Delete</text>
  <rect x="120" y="145" width="225" height="220" fill="url(#checks)" stroke="#777" stroke-dasharray="6 5"/>
  <use href="#leaf" fill="#777" stroke="#222" stroke-width="3"/>
  <path d="M170 345Q225 250 302 181" fill="none" stroke="white" stroke-width="3"/>
  <use href="#leaf" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="4 4" transform="translate(-4 -4)"/>
  <circle cx="142" cy="168" r="9" fill="white" stroke="#111" stroke-width="2"/>
  <path d="M140 158L88 126" fill="none" stroke="#333"/>
  <text x="20" y="124" font-size="15">No hit: alpha = 0</text>
  <circle cx="263" cy="243" r="9" fill="white" stroke="#111" stroke-width="2"/>
  <path d="M272 243H365" stroke="#333"/>
  <text x="371" y="238" font-size="15">Hit:</text><text x="371" y="258" font-size="15">select leaf</text>
  <text x="35" y="403" font-size="16">The image rectangle is only a bounds hint.</text>
  <text x="35" y="427" font-size="16">Its transparent corners are not selectable.</text>
  <path d="M0 451H525" stroke="#999"/>
  <text x="20" y="480" font-size="15" font-weight="bold">LAYERS</text>
  <rect x="15" y="492" width="495" height="39" rx="4" fill="#e5e5e5"/>
  <text x="28" y="518" font-size="17">●  Artwork</text><text x="370" y="518" font-size="15">ACTIVE</text>
  <text x="28" y="559" font-size="17">○  Background</text><text x="370" y="559" font-size="15">View only</text>
 </g>
 <g transform="translate(570 90)">
  <rect width="525" height="600" rx="12" fill="white" stroke="#333" stroke-width="2"/>
  <text x="20" y="33" font-size="20" font-weight="bold">02  Erase through overlapping layers</text>
  <path d="M0 50H525M0 104H525" stroke="#999"/>
  <rect x="15" y="63" width="123" height="29" rx="4" fill="#202020"/>
  <text x="27" y="83" fill="white" font-size="16">Partial erase</text>
  <text x="156" y="83" font-size="16">Whole item   Undo</text>
  <circle cx="250" cy="260" r="108" fill="none" stroke="#888" stroke-width="8"/>
  <path d="M80 330Q155 215 250 330T430 330" fill="none" stroke="#222" stroke-width="18" stroke-linecap="round" mask="url(#cut)"/>
  <path d="M250 280V420" stroke="#555" stroke-width="48" stroke-linecap="round" opacity=".08"/>
  <path d="M226 280V415M274 280V415" stroke="#555" stroke-dasharray="5 5" fill="none"/>
  <circle cx="250" cy="292" r="24" stroke="#222" stroke-width="2" fill="none"/>
  <path d="M278 297L350 267" stroke="#333"/><text x="354" y="260" font-size="15">Eraser</text><text x="354" y="280" font-size="15">sweep</text>
  <text x="34" y="145" font-size="15">Background circle remains complete.</text>
  <path d="M180 153L182 176" stroke="#555"/>
  <text x="35" y="403" font-size="16">Only the active layer's ink loses coverage.</text>
  <text x="35" y="427" font-size="16">The same rule applies to images and shapes.</text>
  <path d="M0 451H525" stroke="#999"/>
  <text x="20" y="480" font-size="15" font-weight="bold">LAYERS</text>
  <rect x="15" y="492" width="495" height="39" rx="4" fill="#e5e5e5"/>
  <text x="28" y="518" font-size="17">●  Ink</text><text x="370" y="518" font-size="15">ACTIVE</text>
  <text x="28" y="559" font-size="17">○  Background circle</text><text x="370" y="559" font-size="15">View only</text>
 </g>
</g>
</svg>
