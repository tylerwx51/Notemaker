[package]
name = "notemaker_core"
description = "Shared NoteMaker replica, action model and rendering traversal (port of packages/core Java)"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
crc32fast = "1"
libc = "0.2"
roxmltree = "0.20"
# TLS for https:// peers (Endpoint/HttpConnection). ring provider: pure
# Rust + C/asm built with the NDK clang, no cmake/nasm. See ADR 0028.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-native-certs = "0.8"

[dev-dependencies]
sha2 = "0.10"
rcgen = "0.13"

[[example]]
name = "parity"
path = "tests/parity/parity.rs"

[lints]
workspace = true
